name: Lendtable
description: 'Lendtable was a US consumer fintech that extended a line of credit so individuals could afford
  to max out employer-sponsored benefits they would otherwise leave on the table — primarily the employer
  401(k) match and Employee Stock Purchase Plans (ESPP). In its own words: "Lendtable gives a line of credit
  to help individuals get their employer 401(k) match and ESPP." The product advanced cash against a user''s
  paycheck contributions and took a share of the resulting gains, and was distributed direct-to-consumer and
  through employers via a Lendtable for Business offering, alongside an iOS app and a Zendesk help center.
  Lendtable was backed by Partech among others. The company now appears defunct: lendtable.com, the blog, and
  all product paths return HTTP 402 DEPLOYMENT_DISABLED (probed 2026-07-19), the iOS App Store listing is
  delisted, and the last successful Internet Archive capture of the live site is 2024-12-06. DNS, Google
  Workspace mail (MX/SPF/DMARC) and the GitHub organization remain registered. No public API, developer
  portal, or machine-readable API artifacts were ever published by this company.'
